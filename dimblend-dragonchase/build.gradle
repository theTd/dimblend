plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Maven 仓库收敛到单仓根 build.gradle（全集），子工程不再各自声明。

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "LOGFILE": Use this if you're wanting to output to the console AND a file. Logging to file is not required.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create 6.0.10（与实例一致）：车架脏值挂在 SmartBlockEntity 的 BlockEntityBehaviour 上，
    // 随 BE 存盘与客户端同步；伪装板倒置判定用 CopycatPanelBlock.FACING。
    implementation("com.simibubi.create:create-1.21.1:6.0.10-281") {
        exclude group: "dev.ftb.mods"
        exclude group: "mezz.jei"
        exclude group: "maven.modrinth"
        exclude group: "info.journeymap"
        exclude group: "cc.tweaked"
        exclude group: "top.theillusivec4.curios"
        exclude group: "dev.architectury"
        // vanillin 1.1.3-41 comes in via Create's POM but is absent from the instance;
        // excluding it keeps dev runs aligned with what actually runs.
        exclude group: "dev.engine-room.vanillin"
    }
    // Ponder pinned to 1.0.82 = the version Create 6.0.10 JarJars at runtime (zero drift).
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    implementation "dev.architectury:architectury-neoforge:13.0.8"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
    // 以下均为 mod jar，compileOnly：运行时由整合包提供。
    // Copycats+：龙巢/车厢的伪装梁与伪装台阶材质写在多状态 BE 上。
    compileOnly "maven.modrinth:copycats:3.0.4+mc.1.21.1-neoforge"
    // dimblend 核心：只许 import dimblend.api（区域强制、白线覆盖、末影刹车服务、折跃门几何、站场车厢查询）。
    compileOnly project(":dimblend")
    // Simurail：自动车钩、物理转向架参数（无公开 Maven，引用仓库内唯一一份）。
    compileOnly files(rootProject.file("dimblend/libs/simurail-1.21.1-0.0.0-a+ecd2dd3.jar"))
    // Sable：子关卡组装、常加载票据、刚体速度。
    compileOnly files(rootProject.file("dimblend/libs/sable-neoforge-1.21.1-2.0.5_cui-modded.jar"))
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${project.sable_companion_version}"
    // 独立 GameTest fixture：-PwithDragonChaseGameTest 时把物理/方块栈提升进 dev 运行，
    // 并只在这次运行里加载 dragonChaseFixture 资源（测试世界预设 + empty 模板）。
    // 用法：./gradlew :dimblend-dragonchase:runGameTestServer -PwithDragonChaseGameTest
    if (project.hasProperty('withDragonChaseGameTest')) {
        localRuntime project(":dimblend")
        localRuntime project(":dimblend-blocks")
        localRuntime files(rootProject.file("dimblend/libs/sable-neoforge-1.21.1-2.0.5_cui-modded.jar"))
        localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${project.sable_companion_version}"
        localRuntime files(rootProject.file("dimblend/libs/simurail-1.21.1-0.0.0-a+ecd2dd3.jar"))
        localRuntime "maven.modrinth:copycats:3.0.4+mc.1.21.1-neoforge"
        if (providers.gradleProperty('dragonChaseModsDir').isPresent()) {
            localRuntime fileTree(dir: providers.gradleProperty('dragonChaseModsDir').get(), includes: [
                    'aether-*.jar', 'BiomesOPlenty-*.jar', 'GlitchCore-*.jar', 'deeperdarker-*.jar',
                    'Voidscape-*.jar', 'owo-lib-*.jar', 'create-aeronautics-bundled-*.jar', 'TerraBlender-*.jar'])
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// 纯逻辑单测会用到 Vec3 等原版值类型：与其余子工程相同，测试类路径带上 main 的编译类路径。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so you need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Dragon Chase 的 GameTest 世界只属于这一支 fixture：GameTestServer 只会烘焙
// minecraft:flat，所以把这套维度写进该预设，并补上 empty 模板；两者都只在
// -PwithDragonChaseGameTest 的运行里存在，永远不会进入 sourceSets.main.resources
//（正常 build / jar 与发布产物 100% 不受影响）。
if (project.hasProperty('withDragonChaseGameTest')) {
    def dcRunDir = layout.buildDirectory.dir('dragonchase-gametest-run')
    neoForge.runs.gameTestServer.systemProperty 'dimblend.dragonchase.gametest', 'true'
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    neoForge.runs.gameTestServer.gameDirectory = dcRunDir
    tasks.named('runGameTestServer').configure {
        doFirst {
            def worldDir = new File(dcRunDir.get().asFile, 'world').canonicalFile
            if (worldDir.parentFile != dcRunDir.get().asFile.canonicalFile) {
                throw new GradleException('DragonChase test world escaped its generated run directory')
            }
            if (worldDir.exists() && !worldDir.deleteDir()) {
                throw new GradleException('Could not reset the generated DragonChase test world')
            }
        }
    }
    def dragonChasePreset = tasks.register('generateDragonChaseTestPreset') {
        def modId = project.mod_id
        def sourceDimension = rootProject.file('dimblend/src/main/resources/data/dimblend/dimension/rotating.json')
        def sourceEmptyTemplate = rootProject.file('dimblend-experience/src/main/resources/data/dimblend_chassis/structure/empty.nbt')
        def outputDir = layout.buildDirectory.dir('generated/dragonchase-test-preset')
        inputs.property('modId', modId)
        inputs.file(sourceDimension)
        inputs.file(sourceEmptyTemplate)
        outputs.dir(outputDir)
        doLast {
            def rotating = new groovy.json.JsonSlurper().parse(sourceDimension, 'UTF-8')
            rotating.generator.delegates = rotating.generator.delegates.take(4)
            def dimensions = [
                    'minecraft:overworld': [type: 'minecraft:overworld', generator: [type: 'minecraft:flat', settings: [
                            biome: 'minecraft:plains', features: false, lakes: false, structure_overrides: [],
                            layers: [[block: 'minecraft:bedrock', height: 1], [block: 'minecraft:dirt', height: 2],
                                     [block: 'minecraft:grass_block', height: 1]]]]],
                    'minecraft:the_nether': [type: 'minecraft:the_nether', generator: rotating.generator.delegates[3]],
                    'minecraft:the_end': [type: 'minecraft:the_end', generator: rotating.generator.delegates[2]],
                    'dimblend:rotating': rotating]
            def flatOut = outputDir.get().file('data/minecraft/worldgen/world_preset/flat.json').asFile
            flatOut.parentFile.mkdirs()
            flatOut.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([dimensions: dimensions])), 'UTF-8')

            def templateOut = outputDir.get().file("data/${modId}/structure/empty.nbt").asFile
            templateOut.parentFile.mkdirs()
            java.nio.file.Files.copy(sourceEmptyTemplate.toPath(), templateOut.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    def dragonChaseFixture = sourceSets.create('dragonChaseFixture')
    dragonChaseFixture.resources.srcDir(dragonChasePreset)
    neoForge.mods.named(project.mod_id) {
        sourceSet(dragonChaseFixture)
    }
}
