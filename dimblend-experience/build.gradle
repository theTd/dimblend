plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Maven 仓库收敛到单仓根 build.gradle（全集），子工程不再各自声明。

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional panel bridge: experience only imports carwash's api package.
    compileOnly project(":dimblend-carwash")
    // Same for radio: only its api package (reception noise, End voice frequency, acoustic intensity).
    compileOnly project(":dimblend-radio")
    // Optional local diagnostic panel integration uses the core mod's public API only.
    compileOnly project(":dimblend")
    // A11 贝壳 X 标记：编译期零依赖（TreasureShellMarker 按注册名运行时查
    // dimblend_blocks:shell_marker），dev run / GameTest 需要方块真的在场
    localRuntime project(":dimblend-blocks")
    // Cross-mod compat: compile against the exact versions running in the TrainTripWorld
    // instance. Create comes from maven.createmod.net (same 6.0.10 upstream); the addons are
    // the runtime jars copied into ./libs (provenance & restore steps: docs/requirements-spec.md「libs jar 清单」).
    implementation("com.simibubi.create:create-1.21.1:6.0.10-281") {
        exclude group: "dev.ftb.mods"
        exclude group: "mezz.jei"
        exclude group: "maven.modrinth"
        exclude group: "info.journeymap"
        exclude group: "cc.tweaked"
        exclude group: "top.theillusivec4.curios"
        exclude group: "dev.architectury"
        // vanillin 1.1.3-41 comes in via Create's POM but is absent from the instance;
        // excluding it keeps dev runs aligned with what actually runs.
        exclude group: "dev.engine-room.vanillin"
    }
    // Ponder pinned to 1.0.82 = the version Create 6.0.10 JarJars at runtime (zero drift).
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    implementation "dev.architectury:architectury-neoforge:13.0.8"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
    // Compat stack is compile-only on purpose: these are mod jars and MDG would load
    // them into every dev run. When a feature needs runtime testing, promote the
    // relevant jar to localRuntime for that session instead.
    // 开源 mod 走 Maven 定点版本（与单仓 ES/SnR 同模式），不 vendor blob；
    // 只有无公开 Maven 的（simurail/sable cui-modded/fluid/createfirefightingadd/hardcore_nvg）才留 files("libs/…")。
    compileOnly "maven.modrinth:createaddition:neoforge-1.21.1-1.5.10"
    compileOnly "maven.modrinth:create-diesel-generators:1.21.1-1.3.15"
    compileOnly files("libs/simurail-1.21.1-0.0.0-a+ecd2dd3.jar")
    compileOnly files("libs/sable-neoforge-1.21.1-2.0.5_cui-modded.jar")
    // Create: Fluid 无公开 Maven（Modrinth 已下架，仅 CurseForge 有包），按 simurail/sable 同模式
    // vendor 本地 jar：从运行实例 mods 目录原样复制到 ./libs（2.0.1，与实例一致），
    // compileOnly 编译可见、不进 runtimeClasspath；恢复步骤同 docs/requirements-spec.md「libs jar 清单」。
    compileOnly files("libs/fluid-2.0.1.jar")
    // Create: Fire Fighting Add（消防水带放置/拆卸数量守恒修复）同样无公开 Maven，
    // 从运行实例 mods 目录原样复制到 ./libs（0.2.1-beta，与实例一致）：compileOnly
    // 只给 mixin/GameTest 编译可见，不进 runtimeClasspath；恢复步骤同 docs/requirements-spec.md
    // 「libs jar 清单」。
    compileOnly files("libs/createfirefightingadd-0.2.1-beta.jar")
    // hardcore_nvg（夜视仪低电量渐褪：读 PlayerVariables 附件）无公开 Maven（MCreator
    // 模组，仅 CurseForge），从正式包 mods 目录原样复制到 ./libs（1.1.2，与包一致）：
    // compileOnly 只给客户端图层编译可见；恢复步骤同 docs/requirements-spec.md「libs jar 清单」。
    compileOnly files("libs/hardcore_nvg-1.1.2-neoforge-1.21.1.jar")
    // Pinned to the supplied pack versions; compat classes load only behind mod gates.
    // Version numbers can be shared by Forge/Fabric files: use hash-verified NeoForge version IDs.
    compileOnly "maven.modrinth:yet-another-thirst:xmk0FTsX" // NeoForge 1.21-1.5.2
    compileOnly "maven.modrinth:camerapture:bCB7PwmA" // 1.10.12+mc1.21.1-neoforge
    compileOnly "maven.modrinth:create-connected:iUFG9osW" // 1.2.2-mc1.21.1
    // Jade HUD 集成（分液池灌溉/催熟状态）：定点 15.10.5 与 TrainTripWorld 实例一致；
    // compileOnly——Jade 缺席时 @WailaPlugin 类不被加载（注解 value 门控），无类加载风险。
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"
    // Optional client renderer; Veil 4.3.2 is bundled by Sable at runtime.
    compileOnly "maven.modrinth:veil:EcZhFl38"
    compileOnly "gg.moonflower:molang-compiler:3.1.1.19"
    // sable 的 companion 类型（ActiveSableCompanion 继承链）在独立 companion jar 中
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${project.sable_companion_version}"
    // runData 需要完整构造 mod：StructureBedGuard 等 @EventBusSubscriber
    // FML 启动扫描会无条件加载它们，缺 sable 即 NoClassDefFoundError。localRuntime 仅进 dev 运行，
    // 不进发布 jar；其余 compat jar 仍保持 compileOnly（对应订阅者无第三方引用）。
    localRuntime files("libs/sable-neoforge-1.21.1-2.0.5_cui-modded.jar")
    localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${project.sable_companion_version}"
    // B 板块 CDG 行为的运行时验证：-PwithCdg 时把 CDG 提升进 dev 运行（CDG mixin 与
    // CdgPlacementGuardGameTests 才会加载），默认仍 compileOnly，dev 运行与实例对齐。
    // 用法：./gradlew :dimblend-experience:runGameTestServer -PwithCdg
    if (project.hasProperty('withCdg')) {
        localRuntime "maven.modrinth:create-diesel-generators:1.21.1-1.3.15"
    }
    // CCA 电动马达/电池汽笛音的运行时验证：-PwithCca 时把 CCA 提升进 dev 运行
    // （TrainHornCcaGameTests 才会注册），默认仍 compileOnly，dev 运行与实例对齐。
    // 用法：./gradlew :dimblend-experience:runGameTestServer -PwithCca
    if (project.hasProperty('withCca')) {
        localRuntime "maven.modrinth:createaddition:neoforge-1.21.1-1.5.10"
    }
    // Create: Fluid 集水器 Mixin 的运行时验证：-PwithFluid 时把 Fluid 提升进 dev 运行
    // （GutterOutlet*Mixin 与 GutterOutletBiomeProjectionGameTests 才会加载），默认仍 compileOnly。
    // 用法：./gradlew :dimblend-experience:runGameTestServer -PwithFluid
    if (project.hasProperty('withFluid')) {
        localRuntime files("libs/fluid-2.0.1.jar")
    }
    // 消防水带数量守恒 Mixin 的运行时验证：-PwithFireHose 时把 Fire Fighting Add
    // 提升进 dev 运行（FireHose*Mixin 与 FireHoseDropGameTests 才会加载），默认仍
    // compileOnly，dev 运行与实例对齐。
    // 用法：./gradlew :dimblend-experience:runGameTestServer -PwithFireHose
    if (project.hasProperty('withFireHose')) {
        localRuntime files("libs/createfirefightingadd-0.2.1-beta.jar")
    }
    // Focused 2026-10-16 compatibility GameTests, selected by their own template namespace.
    if (project.hasProperty('withBatchCompat')) {
        localRuntime "maven.modrinth:create-diesel-generators:1.21.1-1.3.15"
        localRuntime "maven.modrinth:yet-another-thirst:xmk0FTsX"
        localRuntime "maven.modrinth:create-connected:iUFG9osW"
        localRuntime files("libs/fluid-2.0.1.jar")
        localRuntime project(":dimblend-craft")
    }
    // Rest-only sleeping and the optional YAT suspension hook.
    if (project.hasProperty('withSleepRest')) {
        localRuntime "maven.modrinth:yet-another-thirst:xmk0FTsX"
    }
    // Jade HUD 的实际观感验证：-PwithJade 时把 Jade 提升进 dev 运行，默认仍 compileOnly。
    // 用法：./gradlew :dimblend-experience:runClient -PwithJade
    if (project.hasProperty('withJade')) {
        localRuntime "maven.modrinth:jade:15.10.5+neoforge"
    }
    // Exercise the optional DnDecor state mixin against an explicitly supplied mod jar.
    if (project.hasProperty('withHeadlights')) {
        if (!providers.gradleProperty('headlightDecorJar').isPresent()) {
            throw new GradleException('withHeadlights requires -PheadlightDecorJar=<Design-n-Decor jar>')
        }
        localRuntime files(providers.gradleProperty('headlightDecorJar').get())
    }
    // Only the standard-chassis integration tests, with the actual physics/block stack.
    if (project.hasProperty('withChassis')) {
        localRuntime project(":dimblend")
        localRuntime project(":dimblend-craft")
        localRuntime files("libs/simurail-1.21.1-0.0.0-a+ecd2dd3.jar")
        localRuntime "maven.modrinth:copycats:3.0.4+mc.1.21.1-neoforge"
        localRuntime "maven.modrinth:create-steam-n-rails-1.21.1:0.2.0-beta.2+neoforge-mc1.21.1"
        // Supply the installed pack's required dimension mods without machine-specific paths.
        if (providers.gradleProperty('chassisModsDir').isPresent()) {
            localRuntime fileTree(dir: providers.gradleProperty('chassisModsDir').get(), includes: [
                    'aether-*.jar', 'BiomesOPlenty-*.jar', 'GlitchCore-*.jar', 'deeperdarker-*.jar',
                    'Voidscape-*.jar', 'owo-lib-*.jar', 'create-aeronautics-bundled-*.jar', 'TerraBlender-*.jar'])
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

if (project.hasProperty('withBatchCompat')) {
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', 'dimblend_compat_batch'
}
if (project.hasProperty('withSleepRest')) {
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', 'dimblend_sleep'
    neoForge.runs.gameTestServer.gameDirectory = layout.buildDirectory.dir('sleep-rest-gametest-run')
}
if (project.hasProperty('withHeadlights')) {
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', 'dimblend_headlights'
    neoForge.runs.gameTestServer.gameDirectory = layout.buildDirectory.dir('headlight-gametest-run')
}
if (project.hasProperty('withChassis')) {
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', 'dimblend_chassis'
    def chassisRunDir = layout.buildDirectory.dir('chassis-gametest-run')
    neoForge.runs.gameTestServer.gameDirectory = chassisRunDir
    tasks.named('runGameTestServer').configure {
        doFirst {
            // The depot intentionally never refills; this new-world fixture needs a fresh save.
            def worldDir = new File(chassisRunDir.get().asFile, 'world').canonicalFile
            if (worldDir.parentFile != chassisRunDir.get().asFile.canonicalFile) {
                throw new GradleException('Chassis test world escaped its generated run directory')
            }
            if (worldDir.exists() && !worldDir.deleteDir()) {
                throw new GradleException('Could not reset the generated chassis test world')
            }
        }
    }
    // GameTestServer bakes only minecraft:flat, ignoring additional datapack dimensions.
    // Add the real rotating definition to that preset in this test run only.
    def chassisPreset = tasks.register('generateChassisTestPreset') {
        def sourceDimension = rootProject.file('dimblend/src/main/resources/data/dimblend/dimension/rotating.json')
        def outputDir = layout.buildDirectory.dir('generated/chassis-test-preset')
        inputs.file(sourceDimension)
        outputs.dir(outputDir)
        doLast {
            def rotating = new groovy.json.JsonSlurper().parse(sourceDimension, 'UTF-8')
            def dimensions = [
                    'minecraft:overworld': [type: 'minecraft:overworld', generator: [type: 'minecraft:flat', settings: [
                            biome: 'minecraft:plains', features: false, lakes: false, structure_overrides: [],
                            layers: [[block: 'minecraft:bedrock', height: 1], [block: 'minecraft:dirt', height: 2],
                                     [block: 'minecraft:grass_block', height: 1]]]]],
                    'minecraft:the_nether': [type: 'minecraft:the_nether', generator: rotating.generator.delegates[3]],
                    'minecraft:the_end': [type: 'minecraft:the_end', generator: rotating.generator.delegates[2]],
                    'dimblend:rotating': rotating]
            // The chassis sites are all in the surface band. Twilight's terrain-data registry
            // is bound after presets decode, so it cannot be embedded in a test preset.
            rotating.generator.delegates = rotating.generator.delegates.take(4)
            def output = outputDir.get().file('data/minecraft/worldgen/world_preset/flat.json').asFile
            output.parentFile.mkdirs()
            output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([dimensions: dimensions])), 'UTF-8')
        }
    }
    sourceSets.main.resources.srcDir(chassisPreset)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Payload round-trip tests use Minecraft codecs and Netty, which MDG only adds to main.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
