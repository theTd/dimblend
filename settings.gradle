pluginManagement {
    repositories {
        gradlePluginPortal()
        // dimblend-craft 仍用 NeoGradle userdev 插件（迁 ModDevGradle 另起独立任务），其插件从此仓库解析。
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'dimblend'

include 'dimblend'
include 'dimblend-experience'
include 'dimblend-craft'
include 'dimblend-blocks'
