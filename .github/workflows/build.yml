name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 干净检出可构建的子集：experience/blocks 的 compileOnly 本地罐不入库
      #（见根 README 与 experience docs/requirements-spec.md），CI 不覆盖它们；
      # 本地全量构建仍用 ./gradlew build。
      - name: Build with Gradle
        run: ./gradlew :dimblend:build :dimblend-craft:build