modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
DimBlend Spyglass: faint outlines and approximate distances for saved building structures
while using a spyglass. Structure metadata is read directly from existing region files without
loading, generating, or modifying chunks.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dimblend"
    type="required"
    versionRange="[0.1.2,)"
    ordering="NONE"
    side="BOTH"
