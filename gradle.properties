# 单仓共享属性：MC / NeoForge / Parchment 基线与 Gradle 运行参数。
# 各子工程的 mod_*（id/name/license/version/group）保留在各自 gradle.properties；
# 子工程同名键若重复定义，以子工程为准（Gradle 就近覆盖），此处为统一真相源。
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment（四工程统一 ModDevGradle，用同一键名）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# 与 TrainTripWorld 实例一致（21.1.249）；experience 曾用 21.1.251，已回落，模板下限键保留在子工程
neo_version=21.1.249
loader_version_range=[1,)

# Soft-dependency shim for the Sable physics mod (https://github.com/ryanhcode/sable-companion).
# JiJ'd into the jar; resolved exclusively from https://maven.ryanhcode.dev/releases.
sable_companion_version=1.6.0
